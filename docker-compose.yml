services:
  db:
    image: postgis/postgis:15-3.6-alpine
    environment:
      POSTGRES_DB: nextwork
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Idontcare!1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextwork"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:Idontcare!1@db:5432/nextwork
      MODEL_NAME: tinyllama
      OLLAMA_HOST: http://host.docker.internal:11434
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-us-east-1_hD6WcEfVv}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-7fkm3q2c1aas8ol6dctvpjnaji}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      VITE_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-us-east-1_hD6WcEfVv}
      VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-7fkm3q2c1aas8ol6dctvpjnaji}
      VITE_COGNITO_DOMAIN: https://us-east-1hd6wcefvv.auth.us-east-1.amazoncognito.com
    depends_on:
      - api

volumes:
  postgres_data:
