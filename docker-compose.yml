services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nextwork
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextwork"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nextwork
      MODEL_NAME: tinyllama
      OLLAMA_HOST: http://host.docker.internal:11434
      CORS_ORIGINS: http://localhost:5173
      ADD_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_ADD_API_KEY: ""
    depends_on:
      - api

volumes:
  postgres_data:
